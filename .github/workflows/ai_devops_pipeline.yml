name: AI DevOps Risk Detection Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ai_validate:
    runs-on: ubuntu-latest

    steps:
    # BƯỚC CẢI TIẾN: Thiết lập fetch-depth: 0 để tải toàn bộ lịch sử Git nhằm so sánh được các file vừa sửa
    - name: Checkout Source Code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # BƯỚC CẢI TIẾN: Thêm chữ radon vào cuối chuỗi cài đặt
    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn xgboost imbalanced-learn joblib radon

    - name: Execute AI Risk Validation
      run: |
        python src/models/ci_cd_validator.py
name: AI DevOps Risk Detection Pipeline

# Cấu hình kích hoạt: Tự động chạy mỗi khi có hành động PUSH hoặc PULL REQUEST vào nhánh main
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ai_validate:
    runs-on: ubuntu-latest # Chạy trên hệ điều hành Ubuntu ảo của GitHub

    steps:
    # Bước 1: Khởi tạo sao chép mã nguồn từ kho lưu trữ về máy ảo
    - name: Checkout Source Code
      uses: actions/checkout@v3

    # Bước 2: Thiết lập môi trường Python
    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # Bước 3: Cài đặt các thư viện cần thiết để chạy mô hình (scikit-learn, xgboost, pandas,...)
    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn xgboost imbalanced-learn joblib

    # Bước 4: Gọi AI Engine Chốt 1 để thẩm định chất lượng commit
    - name: Execute AI Risk Validation
      run: |
        python src/models/ci_cd_validator.py